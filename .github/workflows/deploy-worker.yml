name: deploy-worker

# Auto-deploy the Cloudflare Worker whenever worker/ changes on main.
#
# This is deliberately NOT wired through Cloudflare's native git integration —
# Victor has had reliability problems with that. Instead we use wrangler CLI
# from a plain Actions runner, which is boring and predictable.
#
# Required repo secrets (see SETUP.md):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Edit Workers" scope
#   CLOUDFLARE_ACCOUNT_ID — the numeric-looking Account ID from the Cloudflare dashboard
#
# The Worker's OWN runtime secrets (FORGE_DISPATCH_PAT, FORGE_CALLBACK_SECRET,
# FORGE_SESSIONS_REPO) are set via `wrangler secret put` — see the "Seed Worker
# secrets" step below.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Seed Worker secrets (idempotent)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_DISPATCH_PAT:    ${{ secrets.FORGE_DISPATCH_PAT }}
          FORGE_CALLBACK_SECRET: ${{ secrets.FORGE_CALLBACK_SECRET }}
          FORGE_SESSIONS_REPO:   ${{ secrets.FORGE_SESSIONS_REPO }}
        run: |
          # `wrangler secret put` reads the value from stdin. Piping via echo
          # is safe here because these are already GitHub-Actions-masked
          # secrets — the runner scrubs them from any log output.
          if [ -n "$FORGE_DISPATCH_PAT" ];    then echo -n "$FORGE_DISPATCH_PAT"    | npx wrangler secret put FORGE_DISPATCH_PAT;    fi
          if [ -n "$FORGE_CALLBACK_SECRET" ]; then echo -n "$FORGE_CALLBACK_SECRET" | npx wrangler secret put FORGE_CALLBACK_SECRET; fi
          if [ -n "$FORGE_SESSIONS_REPO" ];   then echo -n "$FORGE_SESSIONS_REPO"   | npx wrangler secret put FORGE_SESSIONS_REPO;   fi

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
