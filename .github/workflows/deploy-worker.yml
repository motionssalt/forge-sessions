name: Deploy Forge Worker

# The merged Worker serves both the relay API and the static frontend.
# It deploys whenever either side changes on main.
#
# Ordering note: `wrangler secret put` attaches a secret to an EXISTING
# Worker script — it fails with a routing error (code 7003) if the Worker
# hasn't been deployed yet. So we deploy first (which creates/updates the
# Worker) and seed secrets second. This is safe to run repeatedly: `wrangler
# deploy` on an existing Worker just updates it, and `wrangler secret put`
# overwrites the existing secret value each time.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and frontend
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Seed Worker secrets (idempotent)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_DISPATCH_PAT:    ${{ secrets.FORGE_DISPATCH_PAT }}
          FORGE_CALLBACK_SECRET: ${{ secrets.FORGE_CALLBACK_SECRET }}
          FORGE_SESSIONS_REPO:   ${{ secrets.FORGE_SESSIONS_REPO }}
        run: |
          # `wrangler secret put` reads the value from stdin. The values are
          # already GitHub-Actions-masked secrets.
          if [ -n "$FORGE_DISPATCH_PAT" ];    then echo -n "$FORGE_DISPATCH_PAT"    | npx wrangler secret put FORGE_DISPATCH_PAT;    fi
          if [ -n "$FORGE_CALLBACK_SECRET" ]; then echo -n "$FORGE_CALLBACK_SECRET" | npx wrangler secret put FORGE_CALLBACK_SECRET; fi
          if [ -n "$FORGE_SESSIONS_REPO" ];   then echo -n "$FORGE_SESSIONS_REPO"   | npx wrangler secret put FORGE_SESSIONS_REPO;   fi
