name: Deploy Forge Worker

# The merged Worker serves both the relay API and the static frontend.
# It deploys whenever either side changes on main.
#
# Ordering note: `wrangler secret put` attaches a secret to an EXISTING
# Worker script — it fails with a routing error (code 7003) if the Worker
# hasn't been deployed yet. So we deploy first (which creates/updates the
# Worker) and seed secrets second. This is safe to run repeatedly: `wrangler
# deploy` on an existing Worker just updates it, and `wrangler secret put`
# overwrites the existing secret value each time.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'frontend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and frontend
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars: carry dashboard-set variables/secrets into the new
        # deployment. Without it, a deploy can revert bindings that were set
        # in the dashboard (or by a previous `wrangler secret put`), leaving
        # the serving Worker without FORGE_* secrets even though the
        # dashboard still lists them (workers-sdk #8871 / #4453).
        run: npx wrangler deploy --keep-vars

      - name: Seed Worker secrets (idempotent)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_DISPATCH_PAT:    ${{ secrets.FORGE_DISPATCH_PAT }}
          FORGE_CALLBACK_SECRET: ${{ secrets.FORGE_CALLBACK_SECRET }}
          FORGE_SESSIONS_REPO:   ${{ secrets.FORGE_SESSIONS_REPO }}
        run: |
          # `wrangler secret put` reads the value from stdin. The values are
          # already GitHub-Actions-masked secrets.
          # NOTE: warn loudly instead of silently skipping when a repo secret
          # is unset — a silent skip here is what leaves the deployed Worker
          # without its FORGE_* bindings and produces the runtime 500
          # "Worker is missing required secrets" on /task.
          seed() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              echo -n "$value" | npx wrangler secret put "$name"
            else
              echo "::warning::GitHub repo secret $name is not set — skipping seed. If you manage this secret only via the Cloudflare dashboard this is expected; otherwise the Worker will 500 on /task."
            fi
          }
          seed FORGE_DISPATCH_PAT    "$FORGE_DISPATCH_PAT"
          seed FORGE_CALLBACK_SECRET "$FORGE_CALLBACK_SECRET"
          seed FORGE_SESSIONS_REPO   "$FORGE_SESSIONS_REPO"
