name: deploy-frontend

# Deploys the static frontend to Cloudflare Pages using wrangler.
#
# We use the same pattern as deploy-worker.yml: a plain Actions runner with
# wrangler CLI, not Cloudflare Pages' native git integration.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — must additionally have "Cloudflare Pages: Edit" scope
#   CLOUDFLARE_ACCOUNT_ID — same as for the Worker
#
# The Pages project is created automatically on first run if it doesn't
# already exist yet (see "Ensure Pages project exists" step below) — no
# manual dashboard step needed. Safe to re-run: the check is idempotent.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install --no-audit --no-fund --prefix _tools wrangler@^3.90.0

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `wrangler pages project list` prints existing project names.
          # If forge-ui isn't in that list, create it. This makes the
          # workflow safe to run from a repo with nothing set up yet, and
          # a no-op on every subsequent run once the project exists.
          if ./_tools/node_modules/.bin/wrangler pages project list 2>/dev/null | grep -qE '(^|[^A-Za-z0-9-])forge-ui([^A-Za-z0-9-]|$)'; then
            echo "Pages project 'forge-ui' already exists — skipping creation."
          else
            echo "Pages project 'forge-ui' not found — creating it."
            ./_tools/node_modules/.bin/wrangler pages project create forge-ui --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./_tools/node_modules/.bin/wrangler pages deploy frontend --project-name=forge-ui --branch=main
