# Forge merged Cloudflare Worker.
# Serves the static frontend and handles the relay API endpoints.

name = "forge"
main = "index.js"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../frontend"
binding = "ASSETS"

# Secrets are set with `wrangler secret put <NAME>` (or by the deploy workflow).
# Do not put actual secret values in this file.
#
# Required secrets:
#   FORGE_DISPATCH_PAT     — GitHub PAT used to fire repository_dispatch
#   FORGE_CALLBACK_SECRET  — shared secret used by Actions for /progress
#   FORGE_SESSIONS_REPO    — owner/repo of the sessions repository

[vars]
FORGE_DISPATCH_EVENT_TYPE = "forge-task"

# Wrangler resolves the asset directory relative to this configuration file.
# The frontend is a plain static site and has no build step.
